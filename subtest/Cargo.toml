[package]
name = "subtest"
description = "macro to easily use test setup code from one test function in another one"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["Nikolaus Thümmel <commit.nthuemmel@ntcomputer.de>"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
categories = ["development-tools::testing"]
keywords = ["test", "macro", "fixture"]
homepage = "https://github.com/nthuemmel/subtest"
repository = "https://github.com/nthuemmel/subtest"

[lib]
proc-macro = true

[dependencies]
subtest-impl = { workspace = true }

[dev-dependencies]
macrotest = { workspace = true }
trybuild = { workspace = true }
tokio = { workspace = true }
rstest = { workspace = true }
serial_test = { workspace = true }
anyhow = { workspace = true }
assert2 = { workspace = true }

[lints]
workspace = true
