[workspace]
resolver = "3"
members = [
    "subtest",
    "subtest-impl",
]

[workspace.dependencies]
subtest = { path = "subtest" }
subtest-impl = { path = "subtest-impl" }

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
insta = { version = "1.48.0", features = ["glob"] }
prettyplease = "0.2.37"
macrotest = "1.2.1"
trybuild = "1.0.118"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
rstest = "0.26.1"
