[package]
name = "subtest-impl"
description = "Implementation detail of the `subtest` crate"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["Nikolaus Thümmel <commit.nthuemmel@ntcomputer.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/nthuemmel/subtest"
repository = "https://github.com/nthuemmel/subtest"

[dependencies]
quote = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
prettyplease = { workspace = true }
syn = { workspace = true, features = ["extra-traits"] }
# outside a real macro expansion, `proc-macro2` falls back to an implementation whose spans carry
# no source location at all - which the span tests need to tell a kept location from a lost one
proc-macro2 = { workspace = true, features = ["span-locations"] }

[lints]
workspace = true
